<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>圣诞树请查收 🎄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #030308; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 700px at 68% 38%, #141126 0%, #07060f 52%, #030308 100%);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; display: block; }

  .greeting {
    position: fixed; left: 6vw; top: 50%; transform: translateY(-50%);
    z-index: 5; pointer-events: none; color: #fff;
    animation: fadeIn 2.4s ease .8s both;
  }
  .greeting .en {
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", "Apple Chancery", cursive;
    font-size: clamp(44px, 7.2vw, 92px); line-height: 1.15; white-space: nowrap;
    color: #ffe0f0;
    text-shadow: 0 0 18px rgba(255, 120, 190, .85), 0 0 46px rgba(255, 90, 170, .45), 0 2px 30px rgba(0,0,0,.6);
  }
  .greeting .name {
    margin-top: 14px; font-size: clamp(20px, 2.6vw, 32px); font-weight: 600;
    letter-spacing: .35em; color: #fff;
    text-shadow: 0 0 14px rgba(255, 150, 205, .9), 0 0 34px rgba(255, 110, 180, .5);
  }
  .greeting .name:empty { display: none; }
  .greeting .line {
    margin-top: 12px; font-size: clamp(13px, 1.4vw, 16px); letter-spacing: .18em;
    color: rgba(255, 235, 246, .78);
    text-shadow: 0 0 10px rgba(255, 140, 200, .45);
  }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 18px; z-index: 5; text-align: center;
    font-size: 12px; letter-spacing: .22em; color: rgba(255,255,255,.38); pointer-events: none;
    animation: fadeIn 2s ease 2.2s both;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  .greeting { animation-name: fadeInSide; }
  @keyframes fadeInSide { from { opacity: 0; transform: translateY(-50%) translateX(-14px); } to { opacity: 1; transform: translateY(-50%) translateX(0); } }

  @media (max-width: 700px) {
    .greeting { left: 0; right: 0; top: auto; bottom: 9vh; transform: none; text-align: center; animation-name: fadeIn; }
    .greeting .en { white-space: normal; }
    .greeting .name { letter-spacing: .25em; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="greeting">
  <div class="en">Merry Christmas</div>
  <div class="name" id="nameText"></div>
  <div class="line">比圣诞先抵达的，是送给你的偏爱</div>
</div>
<div class="hint">点 击 屏 幕 会 有 小 星 光 · 拖 动 可 以 转 动 圣 诞 树</div>

<script>
"use strict";
/* ============================================================
   配置区（改这里就能定制，不用动下面的代码）
   - name: 显示在 Merry Christmas 下方的名字，
           也可以在链接后面加 ?name=对方名字 自动带入
   - mainText / subText: 左侧两行文字
   ============================================================ */
const CONFIG = {
  name: "",
  mainText: "Merry Christmas",
  subText: "比圣诞先抵达的，是送给你的偏爱"
};

const params = new URLSearchParams(location.search);
const displayName = params.get("name") || CONFIG.name;
const nameEl = document.getElementById("nameText");
if (displayName) nameEl.textContent = displayName;
document.querySelector(".greeting .en").textContent = params.get("text") || CONFIG.mainText;
document.querySelector(".greeting .line").textContent = CONFIG.subText;

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---------- 发光粒子贴图（按颜色预生成，避免逐帧 shadowBlur 的开销） ---------- */
function makeSprite(rgb) {
  const s = 64, c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.25, "rgba(" + rgb + ",0.95)");
  grad.addColorStop(0.55, "rgba(" + rgb + ",0.32)");
  grad.addColorStop(1, "rgba(" + rgb + ",0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  return c;
}
const SPRITES = {
  white: makeSprite("255,255,255"),
  pinkLight: makeSprite("255,183,217"),
  pink: makeSprite("255,126,190"),
  pinkDeep: makeSprite("255,84,164"),
  gold: makeSprite("255,209,102")
};
const PALETTE = [
  SPRITES.white, SPRITES.white,
  SPRITES.pinkLight, SPRITES.pinkLight, SPRITES.pinkLight,
  SPRITES.pink, SPRITES.pink,
  SPRITES.pinkDeep,
  SPRITES.gold
];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- 背景星星 ---------- */
const bgStars = Array.from({ length: 170 }, () => ({
  x: Math.random(), y: Math.random(),
  r: rand(0.5, 1.6), phase: rand(0, Math.PI * 2), speed: rand(0.4, 1.4)
}));

/* ---------- 雪花 ---------- */
const snows = Array.from({ length: 90 }, () => ({
  x: Math.random(), y: Math.random(),
  r: rand(0.8, 2.6), speed: rand(12, 42), sway: rand(6, 22), phase: rand(0, Math.PI * 2)
}));

/* ---------- 圣诞树粒子 ----------
   3D 锥体：t 从 0（树顶）到 1（树底），半径随 t 增大，
   角度沿螺旋上升，整体绕 Y 轴缓慢旋转，再做透视投影。 */
const isSmall = Math.min(W, H) < 560;
const TREE_COUNT = isSmall ? 950 : 1500;
const treeParticles = [];
for (let i = 0; i < TREE_COUNT; i++) {
  const t = Math.pow(Math.random(), 0.82);            // 越靠下粒子略密
  const angle = t * Math.PI * 2 * 7 + rand(0, Math.PI * 2); // 螺旋圈数 7
  const radiusJitter = rand(0.72, 1.05);
  treeParticles.push({
    t, angle, radiusJitter,
    size: rand(5, 13) * (Math.random() < 0.06 ? 1.9 : 1),  // 少数大颗当装饰球
    sprite: pick(PALETTE),
    phase: rand(0, Math.PI * 2),
    twinkle: rand(1.2, 3.2),
    delay: rand(0, 0.9),                                    // 开场汇聚的先后
    fromAngle: rand(0, Math.PI * 2),
    fromRadius: rand(1.6, 3.2),
    fromY: rand(-0.6, 1.4)
  });
}

/* ---------- 树底铺散的粒子 ---------- */
const groundParticles = Array.from({ length: isSmall ? 150 : 240 }, () => ({
  angle: rand(0, Math.PI * 2),
  radius: Math.pow(Math.random(), 0.6) * 1.9 + 0.12,
  size: rand(4, 10),
  sprite: pick(PALETTE),
  phase: rand(0, Math.PI * 2),
  twinkle: rand(0.8, 2.4),
  drift: rand(0.004, 0.02)
}));

/* ---------- 点击星光 ---------- */
const bursts = [];
function addBurst(x, y) {
  for (let i = 0; i < 26; i++) {
    const a = rand(0, Math.PI * 2), v = rand(30, 170);
    bursts.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 26,
      life: 1, decay: rand(0.7, 1.3),
      size: rand(6, 14), sprite: pick(PALETTE)
    });
  }
}

/* ---------- 交互：拖动旋转 ---------- */
let rot = 0, rotSpeed = 0.22, dragOffset = 0, dragging = false, lastX = 0, downX = 0, downY = 0, moved = false;
canvas.addEventListener("pointerdown", e => {
  dragging = true; moved = false;
  lastX = downX = e.clientX; downY = e.clientY;
});
window.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX;
  if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 6) moved = true;
  dragOffset += dx * 0.008;
});
window.addEventListener("pointerup", e => {
  if (dragging && !moved) addBurst(e.clientX, e.clientY);
  dragging = false;
});

/* ---------- 树顶星星 ---------- */
function drawTopStar(x, y, r, time) {
  const pulse = 1 + Math.sin(time * 2.2) * 0.08;
  r *= pulse;
  ctx.save();
  ctx.translate(x, y);
  // 光晕
  const halo = SPRITES.pink;
  ctx.globalAlpha = 0.85;
  ctx.drawImage(halo, -r * 3.4, -r * 3.4, r * 6.8, r * 6.8);
  // 五角星
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 === 0 ? r : r * 0.45;
    const px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, "#fff0f7");
  g.addColorStop(0.55, "#ff9ecd");
  g.addColorStop(1, "#ff5fae");
  ctx.fillStyle = g;
  ctx.shadowColor = "rgba(255,110,180,0.95)";
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.restore();
}

const easeOut = x => 1 - Math.pow(1 - x, 3);
const clamp01 = x => Math.max(0, Math.min(1, x));

let startTime = performance.now();
function frame(now) {
  const time = (now - startTime) / 1000;
  ctx.clearRect(0, 0, W, H);

  /* 背景星 */
  ctx.fillStyle = "#fff";
  for (const s of bgStars) {
    const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 树的几何参数：桌面端树在右侧，移动端居中 */
  const cx = W > 700 ? W * 0.66 : W * 0.5;
  const treeH = Math.min(H * 0.66, W * 0.9);
  const topY = H * 0.5 - treeH * 0.56;
  const maxR = treeH * 0.36;
  const fov = treeH * 1.15;

  rot += rotSpeed * 0.016 * (dragging ? 0.25 : 1);
  const totalRot = rot + dragOffset;

  const project = (x, y, z) => {
    const scale = fov / (fov + z);
    return { x: cx + x * scale, y: topY + y * scale, scale };
  };

  ctx.globalCompositeOperation = "lighter";

  /* 螺旋光带（淡淡的两条，跟着树一起转） */
  ctx.lineWidth = 1.1;
  for (const shift of [0, Math.PI]) {
    ctx.beginPath();
    ctx.strokeStyle = "rgba(255,160,210,0.16)";
    for (let i = 0; i <= 130; i++) {
      const t = i / 130;
      const a = t * Math.PI * 2 * 7 + totalRot + shift;
      const r = t * maxR;
      const p = project(Math.cos(a) * r, t * treeH, Math.sin(a) * r);
      i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  /* 树底铺散粒子 */
  for (const gp of groundParticles) {
    gp.radius += gp.drift * 0.016;
    if (gp.radius > 2.05) gp.radius = 0.12;
    const a = gp.angle + totalRot * 0.9;
    const r = gp.radius * maxR;
    const p = project(Math.cos(a) * r, treeH * 1.005, Math.sin(a) * r);
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * gp.twinkle + gp.phase));
    const fade = gp.radius > 1.7 ? (2.05 - gp.radius) / 0.35 : 1;
    ctx.globalAlpha = 0.55 * tw * clamp01(fade);
    const s = gp.size * p.scale;
    ctx.drawImage(gp.sprite, p.x - s / 2, p.y - s / 2, s, s);
  }

  /* 树身粒子（开场从外侧旋入汇聚） */
  const intro = clamp01(time / 3.2);
  for (const pt of treeParticles) {
    const local = easeOut(clamp01((intro - pt.delay * 0.35) / Math.max(0.001, 1 - pt.delay * 0.35)));
    const a = pt.angle + totalRot;
    const r = pt.t * maxR * pt.radiusJitter;
    const tx = Math.cos(a) * r, tz = Math.sin(a) * r, ty = pt.t * treeH;
    // 汇聚前的起始位置：在更大的螺旋外側
    const fa = pt.fromAngle + totalRot + (1 - local) * 2.4;
    const fr = pt.fromRadius * maxR;
    const fx = Math.cos(fa) * fr, fz = Math.sin(fa) * fr, fy = pt.fromY * treeH;
    const x = fx + (tx - fx) * local;
    const z = fz + (tz - fz) * local;
    const y = fy + (ty - fy) * local;
    const p = project(x, y, z);
    const tw = 0.55 + 0.45 * Math.sin(time * pt.twinkle + pt.phase);
    ctx.globalAlpha = Math.max(0, Math.min(1, tw * (0.35 + 0.65 * local)));
    const s = pt.size * p.scale * (0.7 + 0.3 * local);
    ctx.drawImage(pt.sprite, p.x - s / 2, p.y - s / 2, s, s);
  }

  /* 点击星光 */
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.life -= b.decay * 0.016;
    if (b.life <= 0) { bursts.splice(i, 1); continue; }
    b.x += b.vx * 0.016; b.y += b.vy * 0.016;
    b.vy += 60 * 0.016; b.vx *= 0.985; b.vy *= 0.985;
    ctx.globalAlpha = b.life;
    ctx.drawImage(b.sprite, b.x - b.size / 2, b.y - b.size / 2, b.size, b.size);
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  /* 树顶粉色星星 */
  drawTopStar(cx, topY - treeH * 0.035, Math.max(13, treeH * 0.035), time);

  /* 雪花（普通混合，避免发光叠加过曝） */
  ctx.fillStyle = "#fff";
  for (const sn of snows) {
    sn.y += sn.speed * 0.016 / H;
    if (sn.y > 1.02) { sn.y = -0.02; sn.x = Math.random(); }
    const sx = sn.x * W + Math.sin(time * 0.7 + sn.phase) * sn.sway;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(sx, sn.y * H, sn.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
